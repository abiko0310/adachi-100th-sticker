<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff9f3">
<meta name="description" content="足立康史 政策×政局 徹底解説CH 配信100回記念デジタルステッカー・スマホ壁紙を無料プレゼント">
<title>祝！配信100回記念｜記念画像プレゼント</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(155deg,#fff9f3,#f4f7fc);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#24344c;min-height:100vh}
.wrap{max-width:850px;margin:auto;padding:42px 20px 60px;text-align:center}
.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:700;color:#66768b}
.channel{font-size:clamp(13px,2.4vw,17px);font-weight:700;line-height:1.6;margin:12px auto 4px;color:#344b68}
.title{font-size:clamp(27px,5vw,46px);margin:12px 0 12px;line-height:1.35}
.title span{color:#d89a25}
.lead{font-size:15px;line-height:1.9;color:#5d6a7c;margin:0 auto 22px;max-width:700px}
.gifts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px auto 0;align-items:start}
.gift{padding:20px 15px 22px;background:#ffffffb8;border:1px solid #e8e9ed;border-radius:22px;box-shadow:0 8px 25px #25364c0b}
.gift h2{font-size:19px;margin:0 0 8px}
.gift .desc{font-size:13px;color:#68788a;margin:0 0 14px}
.preview{height:350px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.preview img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 8px 9px #25364c22)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;width:100%;padding:12px 16px;background:#24344c;color:white;text-decoration:none;font-weight:700;font-size:15px;border-radius:999px;box-shadow:0 7px 18px #24344c30}
.btn:hover{background:#354e70}
.small{font-size:12px;color:#68788a;line-height:1.8;margin:20px auto;max-width:640px}
.foot{margin-top:45px;font-size:12px;color:#8994a1}
@media(max-width:650px){.wrap{padding:34px 14px 50px}.gifts{grid-template-columns:1fr;gap:18px}.gift{padding:18px 16px 20px}.preview{height:auto;max-height:420px;min-height:180px}.preview img{max-height:420px}.title{margin-top:12px}}
<.gift:first-child .preview img{
  width:100%;
  max-height:100%;
}/style>
</head>
<body>
<main class="wrap">
<div class="eyebrow">THANK YOU FOR WATCHING!</div>
<div class="channel">ニコニコチャンネル＋ 足立康史 政策×政局 徹底解説CH</div>
<h1 class="title">祝！<span>配信100回</span>記念</h1>
<p class="lead">いつもご視聴ありがとうございます。<br>感謝の気持ちを込めて、記念デジタルステッカーをプレゼントさせていただきます。</p>
<section class="gifts" aria-label="記念画像ダウンロード">
<article class="gift">
<h2>記念デジタルステッカー</h2>
<p class="desc">背景透過PNG</p>
<div class="preview"><img src="sticker-new.png" alt="配信100回記念デジタルステッカー"></div>
<a class="btn" href="sticker-new.png" download="配信100回記念ステッカー.png">↓ ステッカーをダウンロード</a>
</article>
<article class="gift">
<h2>スマホ用記念画像</h2>
<p class="desc">スマートフォンの壁紙などに</p>
<div class="preview"><img src="壁紙-新しい.png" alt="配信100回記念スマートフォン用画像"></div>
<a class="btn" href="壁紙-新しい.png" download="配信100回記念スマホ用画像.png">↓ スマホ用画像をダウンロード</a>
</article>
</section>
<p class="small">登録不要・無料。iPhoneでダウンロードボタンを押すと画像が表示される場合は、画像を長押しして「写真に保存」を選んでください。うまくいかない場合はSafariで開いてお試しください。</p>
<div class="foot">100th STREAM CELEBRATION</div>
</main>
</body>
</html>
